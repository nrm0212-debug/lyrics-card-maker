。</p><input id=&quot;defaultRole&quot; type=&quot;hidden&quot; value=&quot;自分&quot;><input id=&quot;minSize&quot; type=&quot;hidden&quot; value=&quot;10&quot;><label>歌詞全文</label><textarea id=&quot;raw&quot; placeholder=&quot;歌詞全文をここへ貼り付け&quot;></textarea><div class=&quot;row&quot;><button id=&quot;analyze&quot;>自動解析</button><button id=&quot;structureToggle&quot; class=&quot;secondary&quot; type=&quot;button&quot;>構成を一括設定</button></div><div id=&quot;structureBox&quot; class=&quot;insertBox&quot;><textarea id=&quot;structureText&quot; style=&quot;min-height:110px&quot; placeholder=&quot;上から1セクション1行で入力\n例：\nイントロ\nAメロ\nサビ\n間奏&quot;></textarea><p class=&quot;hint&quot;>現在のセクション数と同じ行数で入力します。Aメロ/Bメロ/Cメロ/サビ/ラスサビ/イントロ/間奏/ソロ/ブレイク/アウトロ/その他/未判定に対応。</p><div class=&quot;row&quot;><button id=&quot;structureApply&quot; type=&quot;button&quot;>構成を反映</button><button id=&quot;structureCancel&quot; class=&quot;secondary&quot; type=&quot;button&quot;>閉じる</button></div></div><div style=&quot;margin-top:8px&quot;><div class=&quot;row&quot;><button id=&quot;draftToggle&quot; class=&quot;secondary&quot; type=&quot;button&quot;>担当下書きを取り込む</button><button id=&quot;resetParts&quot; class=&quot;secondary&quot; type=&quot;button&quot;>全担当指定をリセット</button></div><div id=&quot;draftBox&quot; class=&quot;insertBox&quot;><textarea id=&quot;draftText&quot; style=&quot;min-height:110px&quot; placeholder=&quot;例：\nChorus | 1サビ | 対象フレーズ\nUnison | 2サビ | 対象フレーズ&quot;></textarea><p class=&quot;hint&quot;>1行＝ 担当 | セクション | 対象フレーズ。同じフレーズを全部指定する場合は ALL:、2回目以降を指定する場合は #2: / #3: を先頭に付けます。基本担当を指定すると、その範囲の例外指定を解除します。</p><div class=&quot;row&quot;><button id=&quot;draftApply&quot; type=&quot;button&quot;>下書きを反映</button><button id=&quot;draftExport&quot; class=&quot;secondary&quot; type=&quot;button&quot;>担当用データを書き出す</button></div><button id=&quot;draftCancel&quot; class=&quot;secondary&quot; type=&quot;button&quot; style=&quot;width:100%;margin-top:6px&quot;>閉じる</button></div></div><div id=&quot;editors&quot;></div><div class=&quot;stickyActions&quot;><div id=&quot;rangeDock&quot; class=&quot;rangeDock&quot;><div id=&quot;rangeDockStatus&quot; class=&quot;rangeFloatStatus&quot;></div><div id=&quot;rangeDockModes&quot; class=&quot;rangeFloatModes&quot;></div><button id=&quot;rangeBack&quot; class=&quot;secondary rangeBack&quot; type=&quot;button&quot;>↶ 開始位置をやり直す</button></div><div class=&quot;actionDock&quot;><button id=&quot;add&quot; class=&quot;secondary addSection&quot;>＋ 演奏セクション追加</button><div id=&quot;insertBox&quot; class=&quot;insertBox&quot;><div class=&quot;row&quot;><select id=&quot;insertType&quot;><option>イントロ</option><option>間奏</option><option>ソロ</option><option>ブレイク</option><option>アウトロ</option><option>その他</option></select><select id=&quot;insertPos&quot;></select></div><input id=&quot;insertMemo&quot; placeholder=&quot;メモ（例：8小節 / Gt. Solo / Drums in）&quot;><div class=&quot;row&quot; style=&quot;margin-top:8px&quot;><button id=&quot;insertOk&quot;>追加する</button><button id=&quot;insertCancel&quot; class=&quot;secondary&quot;>キャンセル</button></div></div></div><button id=&quot;print&quot; style=&quot;width:100%&quot;>PDFを作成</button><div id=&quot;status&quot; class=&quot;status&quot;>歌詞を貼って「自動解析」を押してください。</div></div></section><section class=&quot;panel preview&quot;><div class=&quot;previewHead&quot;><b>A4縦プレビュー</b><span class=&quot;hint&quot;>端末幅に自動調整</span></div><div class=&quot;pageWrap&quot;><main class=&quot;page&quot; id=&quot;page&quot;><div class=&quot;songTitle&quot; id=&quot;pTitle&quot;>Acquiesce</div><div id=&quot;previewSections&quot;></div></main></div></section></div><script>
const $=s=>document.querySelector(s);let sections=[];function normLine(s){return s.trim().replace(/[’‘]/g,&quot;'&quot;).replace(/[^a-z0-9' ]/gi,&quot;&quot;).replace(/\s+/g,&quot; &quot;).toLowerCase()}function similarity(a,b){a=a.map(normLine);b=b.map(normLine);let hit=0;a.forEach(x=>{if(b.includes(x)&amp;&amp;x.length>8)hit++});return hit/Math.max(1,Math.min(a.length,b.length))}
function lineEq(a,b){return normLine(a)===normLine(b)}
function findRepeatedRuns(lines){let N=lines.length,cands=[];for(let len=3;len<=8;len++){for(let a=0;a+len<=N;a++){for(let b=a+len;b+len<=N;b++){let hit=0;for(let k=0;k<len;k++)if(lineEq(lines[a+k],lines[b+k]))hit++;let sim=hit/len;if(sim>=.75)cands.push({a,b,len,sim,score:sim*len})}}}cands.sort((x,y)=>y.score-x.score||y.len-x.len);let best=cands[0];if(!best)return null;let starts=[best.a,best.b];for(let p=best.b+best.len;p+best.len<=N;p++){let hit=0;for(let k=0;k<best.len;k++)if(lineEq(lines[best.a+k],lines[p+k]))hit++;if(hit/best.len>=.75){starts.push(p);p+=best.len-1}}return{start:best.a,len:best.len,starts:[...new Set(starts)].sort((a,b)=>a-b)}}
function smartBlocks(raw){let paras=raw.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);if(paras.length>1)return paras.map(x=>x.split(&quot;\n&quot;).map(x=>x.trim()).filter(Boolean));let lines=raw.split(&quot;\n&quot;).map(x=>x.trim()).filter(Boolean),N=lines.length;if(N<=8)return[lines];let rep=findRepeatedRuns(lines);if(!rep){let out=[];for(let i=0;i<N;i+=6)out.push(lines.slice(i,i+6));return out}let cuts=new Set([0,N]);rep.starts.forEach(p=>{cuts.add(p);cuts.add(Math.min(N,p+rep.len))});let pts=[...cuts].sort((a,b)=>a-b),out=[];for(let i=0;i<pts.length-1;i++){let part=lines.slice(pts[i],pts[i+1]);if(part.length)out.push(part)}return out}
function analyze(){let raw=$(&quot;#raw&quot;).value.trim();if(!raw)return;let lines=raw.split(&quot;\n&quot;).map(x=>x.trim()).filter(Boolean),rep=findRepeatedRuns(lines),bs=smartBlocks(raw);
if(rep&amp;&amp;bs.length>2){let key=lines.slice(rep.start,rep.start+rep.len),tail=key[key.length-1];for(let i=1;i<bs.length;i++){if(bs[i].length>1&amp;&amp;lineEq(bs[i][0],tail)){let prev=bs[i-1];if(similarity(prev,key)>=.55||prev.some(x=>key.some(k=>lineEq(x,k)))){prev.push(bs[i].shift());if(!bs[i].length){bs.splice(i,1);i--}}}}}
sections=bs.map(b=>({name:&quot;未判定&quot;,role:$(&quot;#defaultRole&quot;).value,text:b.join(&quot;\n&quot;)}));if(rep){let key=lines.slice(rep.start,rep.start+rep.len);sections.forEach(s=>{let bl=s.text.split(&quot;\n&quot;);if(similarity(bl,key)>=.75)s.name=&quot;サビ&quot;});let chorusIdx=sections.map((s,i)=>sectionType(s.name)===&quot;サビ&quot;?i:-1).filter(i=>i>=0);if(chorusIdx.length){for(let i=0;i<chorusIdx[0];i++)sections[i].name=i===chorusIdx[0]-1&amp;&amp;chorusIdx[0]>1?&quot;Bメロ&quot;:&quot;Aメロ&quot;;for(let k=0;k<chorusIdx.length-1;k++){let from=chorusIdx[k]+1,to=chorusIdx[k+1],gap=to-from;for(let i=from;i<to;i++)sections[i].name=(gap>1&amp;&amp;i===to-1)?&quot;Bメロ&quot;:&quot;Aメロ&quot;}let last=chorusIdx[chorusIdx.length-1];for(let i=last+1;i<sections.length;i++)sections[i].name=&quot;未判定&quot;;if(last===sections.length-1&amp;&amp;chorusIdx.length>1)sections[last].name=&quot;ラスサビ&quot;}}else if(sections.length)sections[0].name=&quot;Aメロ&quot;;renumber();renderEditors();render();requestAnimationFrame(fit)}
