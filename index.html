const $=s=>document.querySelector(s);let sections=[];function normLine(s){return s.trim().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/gi,"").replace(/\s+/g," ").toLowerCase()}function similarity(a,b){a=a.map(normLine);b=b.map(normLine);let hit=0;a.forEach(x=>{if(b.includes(x)&&x.length>8)hit++});return hit/Math.max(1,Math.min(a.length,b.length))}
function smartBlocks(raw){let paras=raw.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);if(paras.length>1)return paras.map(x=>x.split("\n").filter(Boolean));let lines=raw.split("\n").map(x=>x.trim()).filter(Boolean),N=lines.length;if(N<=8)return[lines];let best=null;for(let len=4;len<=8;len++){for(let a=0;a+len<=N;a++){for(let b=a+len;b+len<=N;b++){let sim=similarity(lines.slice(a,a+len),lines.slice(b,b+len));if(sim>=.72&&(!best||sim>best.sim))best={a,b,len,sim}}}}if(!best){let out=[];for(let i=0;i<N;i+=6)out.push(lines.slice(i,i+6));return out}let out=[];if(best.a>0)out.push(lines.slice(0,best.a));out.push(lines.slice(best.a,best.a+best.len));let mid=lines.slice(best.a+best.len,best.b);if(mid.length)out.push(mid);out.push(lines.slice(best.b,best.b+best.len));let tail=lines.slice(best.b+best.len);if(tail.length)out.push(tail);return out}
function analyze(){let raw=$("#raw").value.trim();if(!raw)return;let bs=smartBlocks(raw),chorusKeys=[];for(let i=0;i<bs.length;i++){for(let j=i+1;j<bs.length;j++){if(similarity(bs[i],bs[j])>=.72){chorusKeys.push(i,j)}}}chorusKeys=[...new Set(chorusKeys)];let v=0,c=0;sections=bs.map((b,i)=>{let isC=chorusKeys.includes(i),name=isC?"CHORUS "+(++c):"VERSE "+(++v);if(i===bs.length-1&&b.length<=8&&!isC)name="OUTRO / REPEAT";return{name,role:$("#defaultRole").value,text:b.join("\n")}});renderEditors();render();requestAnimationFrame(fit)}

function act(a,i){if(a==="del")sections.splice(i,1);if(a==="up"&&i)[sections[i-1],sections[i]]=[sections[i],sections[i-1]];if(a==="down"&&i<sections.length-1)[sections[i+1],sections[i]]=[sections[i],sections[i+1]];if(a==="split"){let ls=sections[i].text.split("\n"),m=Math.ceil(ls.length/2);sections.splice(i,1,{...sections[i],text:ls.slice(0,m).join("\n")},{...sections[i],name:sections[i].name+" B",text:ls.slice(m).join("\n")})}renderEditors();render();requestAnimationFrame(fit)}
function render(){$("#pTitle").textContent=$("#title").value||"Untitled";let root=$("#previewSections");root.innerHTML="";let allSame=sections.length&&sections.every(s=>s.role===sections[0].role);sections.forEach(s=>{let d=document.createElement("section");d.className="section";let h=document.createElement("h2");h.textContent=s.name;if(!allSame){let r=document.createElement("span");r.className="role";r.textContent=s.role;h.appendChild(r)}let l=document.createElement("div");l.className="lyrics";l.textContent=s.text;d.append(h,l);root.appendChild(d)})}
function fit(){let source=$("#page"),min=+$("#minSize").value,lo=7,hi=40,best=7;let probe=source.cloneNode(true);probe.removeAttribute("id");probe.style.cssText="position:fixed;left:-10000px;top:0;width:794px;height:1123px;box-sizing:border-box;padding:0 19px 8px;background:white;overflow:hidden;visibility:hidden;max-width:none;min-height:0;aspect-ratio:auto;";document.body.appendChild(probe);function fits(sz){probe.style.fontSize=sz+"px";void probe.offsetHeight;let last=probe.querySelector(".section:last-child");if(!last)return true;let pr=probe.getBoundingClientRect(),lr=last.getBoundingClientRect();return lr.bottom<=pr.bottom-8&&probe.scrollHeight<=probe.clientHeight}for(let n=0;n<22;n++){let mid=(lo+hi)/2;if(fits(mid)){best=mid;lo=mid}else hi=mid}best=Math.max(7,best-.35);source.style.fontSize=best.toFixed(2)+"px";probe.style.fontSize=best+"px";void probe.offsetHeight;let last=probe.querySelector(".section:last-child"),pr=probe.getBoundingClientRect(),used=last?last.getBoundingClientRect().bottom-pr.top:0,ratio=Math.min(100,Math.round(used/(probe.clientHeight-8)*100));probe.remove();let mode=best<min?" / 1ページでは最低指定より小":" / 1ページ適合";$("#status").textContent=sections.length+"セクション / 最大 約 "+best.toFixed(1)+"px / 使用率 約"+ratio+"%"+mode}

eFit").onclick=function(){setMode("fit")};$("#modeZoom").onclick=function(){setMode("zoom")};$("#analyze").onclick=analyze;$("#add").onclick=()=>{sections.push({name:"SECTION",role:$("#defaultRole").value,text:""});renderEditors();render();fit()};$("#fit").onclick=fit;$("#print").onclick=async()=>{fit();const btn=$("#print"),old=btn.textContent;btn.disabled=true;btn.textContent="PDF作成中…";try{if(!window.html2canvas||!window.jspdf)throw new Error("PDFライブラリを読み込めませんでした");const src=$("#page"),clone=src.cloneNode(true);clone.removeAttribute("id");clone.style.cssText="position:fixed;left:-10000px;top:0;width:794px;height:1123px;box-sizing:border-box;padding:0 19px 8px;background:#fff;overflow:hidden;max-width:none;min-height:0;aspect-ratio:auto;font-size:"+getComputedStyle(src).fontSize+";";document.body.appendChild(clone);const canvas=await html2canvas(clone,{backgroundColor:"#ffffff",scale:2,useCORS:true,logging:false,width:794,height:1123});clone.remove();const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4",compress:true});pdf.addImage(canvas.toDataURL("image/jpeg",0.94),"JPEG",0,0,210,297,undefined,"FAST");const blob=pdf.output("blob"),fileName=safeFileName($("#title").value)+".pdf",url=URL.createObjectURL(blob);const oldViewer=$("#pdfViewer");if(oldViewer)oldViewer.remove();const viewer=document.createElement("div");viewer.id="pdfViewer";viewer.style.cssText="position:fixed;inset:0;z-index:100;background:#111;display:flex;flex-direction:column";viewer.innerHTML='<div style="display:flex;gap:8px;padding:max(8px,env(safe-area-inset-top)) 8px 8px;background:#111"><button id="pdfBack" style="flex:1">← 編集に戻る</button><button id="pdfShare" class="secondary" style="flex:1">共有 / 保存</button></div><div id="pdfFit" style="flex:1;min-height:0;overflow:auto;background:#111;display:flex;justify-content:center;align-items:flex-start;padding:0"><canvas id="pdfCanvas" style="display:block;width:100%;height:auto;background:#fff"></canvas></div>';documen
