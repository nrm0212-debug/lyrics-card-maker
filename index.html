const $=s=>document.querySelector(s);let sections=[];function normLine(s){return s.trim().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/gi,"").replace(/\s+/g," ").toLowerCase()}function similarity(a,b){a=a.map(normLine);b=b.map(normLine);let hit=0;a.forEach(x=>{if(b.includes(x)&&x.length>8)hit++});return hit/Math.max(1,Math.min(a.length,b.length))}

function shortSectionName(name){let n=(name||"").trim();let m=n.match(/^Aメロ\s*(\d+)?/);if(m)return(m[1]||"")+"A";m=n.match(/^Bメロ\s*(\d+)?/);if(m)return(m[1]||"")+"B";m=n.match(/^Cメロ\s*(\d+)?/);if(m)return(m[1]||"")+"C";m=n.match(/^サビ\s*(\d+)?/);if(m)return(m[1]||"")+"サビ";if(/ラスサビ/.test(n))return"ラス\nサビ";if(/イントロ/.test(n))return"イントロ";if(/間奏/.test(n))return"間奏";if(/アウトロ|エンディング/.test(n))return"アウトロ";if(/未判定/.test(n))return"?";return n.replace(/\s+/g,"\n")}function render(){$("#pTitle").textContent=$("#title").value||"Untitled";let root=$("#previewSections");root.innerHTML="";sections.forEach(s=>{let d=document.createElement("section");d.className="section";let h=document.createElement("h2");h.textContent=shortSectionName(s.name);let l=document.createElement("div");l.className="lyrics";l.textContent=s.text;d.append(h,l);root.appendChild(d)})}
