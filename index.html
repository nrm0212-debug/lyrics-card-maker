<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><title>発表会用 歌詞カードメーカー</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111;background:#f3f3f3}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:16px;padding:10px}.panel{background:white;border-radius:14px;padding:14px;box-shadow:0 1px 8px #0002}h1{font-size:20px;margin:0 0 12px}label{font-size:12px;font-weight:700;display:block;margin:10px 0 4px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px}textarea{height:200px}button{border:0;border-radius:9px;padding:10px 12px;font-weight:700;background:#111;color:#fff}.secondary{background:#e9e9e9;color:#111}.row{display:flex;gap:8px}.row>*{flex:1}.hint,.status{font-size:12px;color:#666;line-height:1.5}.pageWrap{overflow:auto;display:flex;justify-content:center}.page{background:#fff;width:210mm;min-height:297mm;padding:6mm;box-shadow:0 2px 14px #0003}.songTitle{text-align:center;font-weight:800;margin-bottom:4px}.section{border:1px solid #222;border-radius:5px;padding:5px 7px;margin:3px 0}.section h2{font-size:.9em;margin:0 0 3px}.role{float:right;font-size:.65em}.lyrics{white-space:pre-wrap;line-height:1.22}.sectionEditor{border:1px solid #ddd;border-radius:8px;padding:8px;margin-top:7px}.sectionEditor textarea{height:90px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px}.controls{display:flex;gap:5px;margin-top:4px}.controls button{padding:5px 7px;font-size:11px}.status{margin-top:8px;padding:8px;background:#f5f5f5;border-radius:8px}@media(max-width:900px){.app{grid-template-columns:1fr;padding:8px}.panel{padding:10px}.pageWrap{max-height:72vh}.page{transform:scale(.46);transform-origin:top center;margin-bottom:-160mm}button{min-height:44px}input,textarea,select{font-size:16px}}@media print{.editor{display:none}.app{display:block;padding:0}.panel.preview{box-shadow:none;padding:0}.pageWrap{overflow:visible}.page{box-shadow:none;transform:none!important;width:210mm;min-height:297mm;padding:5mm}@page{size:A4 portrait;margin:0}}</style></head><body><div class='app'><div class='panel editor'><h1>🎤 発表会用 歌詞カードメーカー</h1><p class='hint'>歌詞はこの端末内で処理します。全文を貼り付けて自動解析してください。</p><label>曲名</label><input id='title' value='Acquiesce'><div class='row'><div><label>担当</label><select id='defaultRole'><option>自分</option><option>相手</option><option>BOTH</option><option>演奏のみ</option></select></div><div><label>最低文字サイズ</label><select id='minSize'><option>10</option><option selected>12</option><option>13</option><option>14</option></select></div></div><label>歌詞全文</label><textarea id='raw' placeholder='歌詞全文をここへ貼り付け'></textarea><div class='row'><button id='analyze'>自動解析</button><button id='add' class='secondary'>セクション追加</button></div><div id='editors'></div><div class='row' style='margin-top:10px'><button id='fit'>最大文字に最適化</button><button onclick='window.print()' class='secondary'>PDF保存</button></div><div id='status' class='status'>歌詞を貼って「自動解析」を押してください。</div></div><div class='panel preview'><div class='pageWrap'><main class='page' id='page'><div class='songTitle' id='pTitle'>Acquiesce</div><div id='previewSections'></div></main></div></div></div><script>const $=s=>document.querySelector(s);let sections=[];function norm(s){return s.trim().replace(/[’‘]/g,"'").replace(/\s+/g,' ').toLowerCase()}function analyze(){const raw=$('#raw').value.trim();if(!raw)return;let blocks=raw.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);if(blocks.length===1){let lines=raw.split(/\n/).map(x=>x.trim()).filter(Boolean);blocks=[];for(let i=0;i<lines.length;i+=6)blocks.push(lines.slice(i,i+6).join('\n'))}const counts={};blocks.forEach(b=>counts[norm(b)]=(counts[norm(b)]||0)+1);let v=0,c=0;sections=blocks.map((b,i)=>{let repeated=counts[norm(b)]>1;let name=repeated?'CHORUS '+(++c):'VERSE '+(++v);if(i===blocks.length-1&&b.split('\n').length<=5)name='OUTRO / REPEAT';return{name,role:$('#defaultRole').value,text:b}});renderEditors();render();fit()}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function renderEditors(){let root=$('#editors');root.innerHTML='';sections.forEach((s,i)=>{let d=document.createElement('div');d.className='sectionEditor';d.innerHTML="<div class='mini'><input data-k='name' data-i='"+i+"' value='"+esc(s.name)+"'><select data-k='role' data-i='"+i+"'><option>自分</option><option>相手</option><option>BOTH</option><option>演奏のみ</option></select></div><textarea data-k='text' data-i='"+i+"'>"+esc(s.text)+"</textarea><div class='controls'><button class='secondary' data-act='up' data-i='"+i+"'>↑</button><button class='secondary' data-act='down' data-i='"+i+"'>↓</button><button class='secondary' data-act='split' data-i='"+i+"'>分割</button><button class='secondary' data-act='del' data-i='"+i+"'>削除</button></div>";d.querySelector("select").value=s.role;root.appendChild(d)});root.querySelectorAll('[data-k]').forEach(el=>el.oninput=e=>{let i=+e.target.dataset.i;sections[i][e.target.dataset.k]=e.target.value;render();fit()});root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,+b.dataset.i))}function act(a,i){if(a==='del')sections.splice(i,1);if(a==='up'&&i)[sections[i-1],sections[i]]=[sections[i],sections[i-1]];if(a==='down'&&i<sections.length-1)[sections[i+1],sections[i]]=[sections[i],sections[i+1]];if(a==='split'){let ls=sections[i].text.split('\n'),m=Math.ceil(ls.length/2);sections.splice(i,1,{...sections[i],text:ls.slice(0,m).join('\n')},{...sections[i],name:sections[i].name+' B',text:ls.slice(m).join('\n')})}renderEditors();render();fit()}function render(){$('#pTitle').textContent=$('#title').value||'Untitled';let root=$('#previewSections');root.innerHTML='';sections.forEach(s=>{let d=document.createElement('section');d.className='section';let h=document.createElement('h2');h.textContent=s.name;let r=document.createElement('span');r.className='role';r.textContent=s.role;h.appendChild(r);let l=document.createElement('div');l.className='lyrics';l.textContent=s.text;d.append(h,l);root.appendChild(d)})}function fit(){let page=$('#page'),min=+$('#minSize').value,lo=min,hi=28,best=min;for(let n=0;n<14;n++){let mid=(lo+hi)/2;page.style.fontSize=mid+'px';if(page.scrollHeight<=page.clientHeight+1){best=mid;lo=mid}else hi=mid}page.style.fontSize=best.toFixed(1)+'px';$('#status').textContent='現在: '+sections.length+'セクション / 最大文字サイズ 約 '+best.toFixed(1)+'px / '+(best<=min+.2?'最低サイズ付近':'1ページに収まっています')}$('#analyze').onclick=analyze;$('#add').onclick=()=>{sections.push({name:'SECTION',role:$('#defaultRole').value,text:''});renderEditors();render();fit()};$('#fit').onclick=fit;$('#title').oninput=()=>{render();fit()};$('#minSize').onchange=fit;window.onresize=fit;render();fit();</script></body></html>
