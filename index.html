</style></head><body><div class="app"><section class="panel editor"><div class="top"><h1>🎤 歌詞カードメーカー</h1><span class="appVersion">v0.8.1</span></div><p class="hint">iPhone・iPad・PC対応。歌詞は端末内だけで処理します。</p><label>曲名</label><input id="title" value="Acquiesce"><div class="row mobileStack"><div><label>担当</label><select id="defaultRole"><option>自分</option><option>相手</option><option>BOTH</option><option>演奏のみ</option></select></div><div><label>最低文字サイズ</label><select id="minSize"><option>10</option><option selected>12</option><option>13</option><option>14</option></select></div></div><label>歌詞全文</label><textarea id="raw" placeholder="歌詞全文をここへ貼り付け"></textarea><div class="row"><button id="analyze">自動解析</button><button id="add" class="secondary">追加</button></div><div id="editors"></div><div class="mobilePreviewBar"><button id="openPreview">👁 全画面プレビュー</button></div><div class="stickyActions"><div class="row"><button id="fit">1ページ最大化</button><button id="print" class="secondary">PDF / 印刷</button></div><div id="status" class="status">歌詞を貼って「自動解析」を押してください。</div></div></section><section class="panel preview"><div class="previewHead"><b>A4縦プレビュー</b><span class="hint">端末幅に自動調整</span></div><div class="pageWrap"><main class="page" id="page"><div class="songTitle" id="pTitle">Acquiesce</div><div id="previewSections"></div></main></div></section></div><script>
const $=s=>document.querySelector(s);let sections=[];function normLine(s){return s.trim().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/gi,"").replace(/\s+/g," ").toLowerCase()}function similarity(a,b){a=a.map(normLine);b=b.map(normLine);let hit=0;a.forEach(x=>{if(b.includes(x)&&x.length>8)hit++});return hit/Math.max(1,Math.min(a.length,b.length))}
function smartBlocks(raw){let paras=raw.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);if(paras.length>1)return paras.map(x=>x.split("\n").filter(Boolean));let lines=raw.split("\n").map(x=>x.trim()).filter(Boolean),N=lines.length;if(N<=8)return[lines];let best=null;for(let len=4;len<=8;len++){for(let a=0;a+len<=N;a++){for(let b=a+len;b+len<=N;b++){let sim=similarity(lines.slice(a,a+len),lines.slice(b,b+len));if(sim>=.72&&(!best||sim>best.sim))best={a,b,len,sim}}}}if(!best){let out=[];for(let i=0;i<N;i+=6)out.push(lines.slice(i,i+6));return out}let out=[];if(best.a>0)out.push(lines.slice(0,best.a));out.push(lines.slice(best.a,best.a+best.len));let mid=lines.slice(best.a+best.len,best.b);if(mid.length)out.push(mid);out.push(lines.slice(best.b,best.b+best.len));let tail=lines.slice(best.b+best.len);if(tail.length)out.push(tail);return out}
function analyze(){let raw=$("#raw").value.trim();if(!raw)return;let bs=smartBlocks(raw),chorusKeys=[];for(let i=0;i<bs.length;i++){for(let j=i+1;j<bs.length;j++){if(similarity(bs[i],bs[j])>=.72){chorusKeys.push(i,j)}}}chorusKeys=[...new Set(chorusKeys)];let v=0,c=0;sections=bs.map((b,i)=>{let isC=chorusKeys.includes(i),name=isC?"CHORUS "+(++c):"VERSE "+(++v);if(i===bs.length-1&&b.length<=8&&!isC)name="OUTRO / REPEAT";return{name,role:$("#defaultRole").value,text:b.join("\n")}});renderEditors();render();requestAnimationFrame(fit)}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function renderEditors(){let root=$("#editors");root.innerHTML="";sections.forEach((s,i)=>{let d=document.createElement("div");d.className="sectionEditor";d.innerHTML='<div class="mini"><input data-k="name" data-i="'+i+'" value="'+esc(s.name)+'"><select data-k="role" data-i="'+i+'"><option>自分</option><option>相手</option><option>BOTH</option><option>演奏のみ</option></select></div><textarea data-k="text" data-i="'+i+'">'+esc(s.text)+'</textarea><div class="controls"><button class="secondary" data-act="up" data-i="'+i+'">↑</button><button class="secondary" data-act="down" data-i="'+i+'">↓</button><button class="secondary" data-act="split" data-i="'+i+'">分割</button><button class="secondary" data-act="del" data-i="'+i+'">削除</button></div>';d.querySelector("select").value=s.role;root.appendChild(d)});root.querySelectorAll("[data-k]").forEach(el=>el.oninput=e=>{let i=+e.target.dataset.i;sections[i][e.target.dataset.k]=e.target.value;render();requestAnimationFrame(fit)});root.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>act(b.dataset.act,+b.dataset.i))}
function act(a,i){if(a==="del")sections.splice(i,1);if(a==="up"&&i)[sections[i-1],sections[i]]=[sections[i],sections[i-1]];if(a==="down"&&i<sections.length-1)[sections[i+1],sections[i]]=[sections[i],sections[i+1]];if(a==="split"){let ls=sections[i].text.split("\n"),m=Math.ceil(ls.length/2);sections.splice(i,1,{...sections[i],text:ls.slice(0,m).join("\n")},{...sections[i],name:sections[i].name+" B",text:ls.slice(m).join("\n")})}renderEditors();render();requestAnimationFrame(fit)}
function render(){$("#pTitle").textContent=$("#title").value||"Untitled";let root=$("#previewSections");root.innerHTML="";let allSame=sections.length&&sections.every(s=>s.role===sections[0].role);sections.forEach(s=>{let d=document.createElement("section");d.className="section";let h=document.createElement("h2");h.textContent=s.name;if(!allSame){let r=document.createElement("span");r.className="role";r.textContent=s.role;h.appendChild(r)}let l=document.createElement("div");l.className="lyrics";l.textContent=s.text;d.append(h,l);root.appendChild(d)})}
function fit(){let source=$("#page"),min=+$("#minSize").value,lo=7,hi=40,best=7,probe=document.createElement("div");probe.style.cssText="position:fixed;left:-10000px;top:0;width:794px;height:1123px;box-sizing:border-box;padding:18px;background:white;overflow:hidden;visibility:hidden;";let title=document.createElement("h1");title.textContent=$("#pTitle").textContent;probe.appendChild(title);let root=document.createElement("div");root.innerHTML=$("#previewSections").innerHTML;probe.appendChild(root);document.body.appendChild(probe);function fits(sz){probe.style.fontSize=sz+"px";void probe.offsetHeight;return root.scrollHeight<=probe.clientHeight-title.offsetHeight-36}for(let n=0;n<20;n++){let mid=(lo+hi)/2;if(fits(mid)){best=mid;lo=mid}else hi=mid}source.style.fontSize=best.toFixed(2)+"px";probe.style.fontSize=best+"px";let available=probe.clientHeight-title.offsetHeight-36,ratio=available?Math.min(100,Math.round(root.scrollHeight/available*100)):0;probe.remove();$("#status").textContent=sections.length+"セクション / 最大 約 "+best.toFixed(1)+"px / 使用率 約"+ratio+"%"+(best<min?"（最低指定より小）":"")}
function unwrapPreview(p){let par=p.parentElement;if(par&&(par.classList.contains("fitHolder")||par.classList.contains("zoomHolder"))){par.parentNode.insertBefore(p,par);par.remove()}}function setMode(mode){let m=$("#previewModal"),b=$("#modalBody"),fitBtn=$("#modeFit"),zoomBtn=$("#modeZoom");m.classList.toggle("fit",mode==="fit");m.classList.toggle("zoom",mode==="zoom");fitBtn.classList.toggle("secondary",mode!=="fit");zoomBtn.classList.toggle("secondary",mode!=="zoom");let old=$("#previewFrame");if(old)old.remove();let frame=document.createElement("div");frame.id="previewFrame";let clone=$("#page").cloneNode(true);clone.removeAttribute("id");clone.style.fontSize=getComputedStyle($("#page")).fontSize;frame.appendChild(clone);b.innerHTML="";b.appendChild(frame);let baseW=794,baseH=1123,top=$(".modalTop").getBoundingClientRect().height,availW=window.innerWidth-16,availH=window.innerHeight-top-16,s=mode==="fit"?Math.min(availW/baseW,availH/baseH):Math.min(1,(availW/baseW)*1.65);frame.style.width=(baseW*s)+"px";frame.style.height=(baseH*s)+"px";frame.style.margin="0 auto";frame.style.overflow="hidden";clone.style.width=baseW+"px";clone.style.height=baseH+"px";clone.style.maxWidth="none";clone.style.minHeight="0";clone.style.aspectRatio="auto";clone.style.transformOrigin="top left";clone.style.transform="scale("+s+")";b.style.display="block";b.style.overflow=mode==="fit"?"hidden":"auto";b.scrollTop=0;b.scrollLeft=0}function sizeModalFit(){setMode("fit")}function openPreview(){let m=$("#previewModal"),body=$("#modalBody"),clone=$("#page").cloneNode(true);clone.id="modalPage";body.innerHTML="";body.appendChild(clone);m.classList.add("open","fit");m.classList.remove("zoom");requestAnimationFrame(sizeModalFit)}function bindUI(){$("#openPreview").onclick=openPreview;$("#closePreview").onclick=function(){$("#previewModal").classList.remove("open")};$("#modeFit").onclick=function(){setMode("fit")};$("#modeZoom").onclick=function(){setMode("zoom")};$("#analyze").onclick=analyze;$("#add").onclick=()=>{sections.push({name:"SECTION",role:$("#defaultRole").value,text:""});renderEditors();render();fit()};$("#fit").onclick=fit;$("#print").onclick=()=>{let old=document.getElementById("printFrame");if(old)old.remove();let frame=document.createElement("iframe");frame.id="printFrame";frame.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";document.body.appendChild(frame);let d=frame.contentDocument,clone=$("#page").cloneNode(true);clone.removeAttribute("id");clone.style.fontSize=getComputedStyle($("#page")).fontSize;d.open();d.write('<!doctype html><html><head><meta name="viewport" content="width=device-width"><style>@page{size:A4 portrait;margin:0}html,body{margin:0;padding:0;width:210mm;height:297mm;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}*{box-sizing:border-box}.page{width:210mm;height:297mm;padding:2.5mm 5mm 3mm;overflow:hidden;background:#fff}.page h1{text-align:center;margin:0 0 1mm;font-size:1.05em;line-height:1.05}.section{border:1px solid #222;border-radius:5px;padding:2px 5px;margin:0 0 2px}.section h2{font-size:.82em;margin:0 0 1px;font-weight:800}.lyrics{white-space:pre-wrap;line-height:1.16}.role{float:right;font-size:.8em;font-weight:500}</style></head><body></body></html>');d.close();d.body.appendChild(d.importNode(clone,true));setTimeout(()=>{frame.contentWindow.focus();frame.contentWindow.print()},250)};$("#title").oninput=()=>{render();fit()};$("#minSize").onchange=fit;window.onresize=function(){requestAnimationFrame(fit);if($("#previewModal").classList.contains("open")&&$("#previewModal").classList.contains("fit"))requestAnimationFrame(sizeModalFit)};render();fit()}document.addEventListener("DOMContentLoaded",bindUI);
</script><div id="previewModal" class="modal fit"><div class="modalTop"><button id="modeFit">全体</button><button id="modeZoom" class="secondary">拡大</button><button id="closePreview" class="secondary">編集に戻る</button></div><div class="modalBody" id="modalBody"></div></div></body></html>
